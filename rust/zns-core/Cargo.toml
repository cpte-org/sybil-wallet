[package]
name = "vizor-zns-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy-primitives = "=0.8.26"
alloy-sol-types = "=0.8.26"
bip32 = { version = "=0.5.3", default-features = false, features = ["secp256k1", "std"] }
k256 = { version = "=0.13.4", features = ["ecdsa"] }
rlp = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1"
rand = "0.8"

[dev-dependencies]
bip0039 = "0.12"
